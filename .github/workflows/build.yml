name: Build Neighborhood Builder
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm run build
      - name: Upload website
        uses: actions/upload-artifact@v4
        with:
          name: neighborhood-builder-site
          path: |
            index.html
            README.md
