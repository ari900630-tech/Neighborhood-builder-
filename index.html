<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f7f9fc">
<title>בונה השכונה</title>
<style>
:root{--ink:#172033;--muted:#667085;--line:#e6ebf1;--card:#fff;--accent:#315efb;--bg:#eaf1e7}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg);touch-action:none}
body{min-height:100dvh}
#app{position:relative;width:100%;height:100%;min-height:100dvh;overflow:hidden;background:#dcebd5}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.top{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;height:64px;z-index:5;display:flex;align-items:center;gap:9px;padding:7px 9px;background:#fffffff2;border:1px solid #ffffff;border-radius:20px;box-shadow:0 10px 30px #18243a22;backdrop-filter:blur(14px)}
.logo{font-size:15px;font-weight:950;white-space:nowrap;line-height:1.05}.logo span{display:block;font-size:9px;color:var(--muted);font-weight:700;margin-top:4px}
.stats{display:flex;gap:6px;flex:1;justify-content:center;min-width:0}.stat{min-width:76px;padding:6px 8px;border:1px solid var(--line);border-radius:13px;background:#f8fafc;text-align:center;font-size:11px;font-weight:800;line-height:1.05}.stat b{font-size:13px}
.topBtn{flex:0 0 40px;width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:13px;font-size:17px;font-weight:900;color:var(--ink);box-shadow:0 2px 8px #18243a10}
.topBtn:active,.tool:active,.menu button:active{transform:scale(.96)}
.tip{position:absolute;top:82px;left:50%;transform:translateX(-50%);z-index:4;background:#ffffffe8;border:1px solid #fff;border-radius:13px;padding:7px 12px;font-size:11px;color:#52606d;box-shadow:0 6px 20px #18243a15;white-space:nowrap}
.menu{position:absolute;right:12px;top:84px;width:280px;z-index:10;background:#fffffff7;border:1px solid #fff;border-radius:20px;padding:15px;box-shadow:0 18px 45px #18243a30;display:none;direction:rtl}.menu.show{display:block}.menu h3{margin:0 0 4px;font-size:17px}.menu p{margin:0 0 13px;font-size:12px;color:var(--muted)}.menuRow{display:flex;gap:8px}.menu button{flex:1;border:0;border-radius:12px;padding:11px;background:#eef2f7;color:var(--ink);font-weight:800}.menu .primary{background:var(--accent);color:#fff}
.buildbar{position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:8;width:min(760px,calc(100% - 16px));background:#fffffff5;border:1px solid #fff;border-radius:22px;padding:8px;box-shadow:0 15px 40px #18243a30;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;direction:rtl}.buildbar::-webkit-scrollbar{display:none}
.tool{flex:0 0 78px;min-height:70px;border:0;background:#f4f6f9;color:#344054;border-radius:16px;padding:7px 5px;font-weight:850;transition:transform .12s,background .12s}.tool .ico{width:39px;height:39px;margin:auto;border-radius:12px;display:grid;place-items:center;background:#fff;font-size:21px;box-shadow:0 2px 7px #18243a10}.tool small{display:block;margin-top:5px;font-size:10px;line-height:1.15;white-space:nowrap}.tool.active{background:#edf2ff;color:var(--accent);outline:2px solid #dbe4ff}.tool.active .ico{background:#315efb;color:#fff}
.info{position:absolute;left:12px;bottom:102px;z-index:5;width:205px;background:#fffffff2;border:1px solid #fff;border-radius:16px;padding:11px 12px;box-shadow:0 9px 26px #18243a20;display:none;direction:rtl}.info.show{display:block}.info b{font-size:13px}.info small{display:block;color:var(--muted);margin-top:4px;line-height:1.45}
@media(max-width:700px){
 .top{top:max(6px,env(safe-area-inset-top));left:6px;right:6px;height:56px;border-radius:17px;padding:5px 6px;gap:5px}
 .logo{font-size:12px}.logo span{font-size:8px;margin-top:3px}
 .stats{gap:3px;overflow:hidden}.stat{min-width:52px;padding:5px 3px;font-size:9px;border-radius:11px}.stat b{font-size:11px}
 .topBtn{flex-basis:36px;width:36px;height:36px;border-radius:11px;font-size:15px}
 .tip{top:68px;max-width:calc(100% - 24px);font-size:9px;padding:6px 9px;overflow:hidden;text-overflow:ellipsis}
 .menu{top:68px;right:7px;width:calc(100% - 14px);max-width:300px}
 .buildbar{width:calc(100% - 12px);bottom:max(6px,env(safe-area-inset-bottom));padding:7px;border-radius:19px;gap:6px}
 .tool{flex-basis:72px;min-width:72px;min-height:72px;padding:7px 4px}
 .tool .ico{width:37px;height:37px}.tool small{font-size:9px}
 .info{left:7px;bottom:91px;width:calc(100% - 14px);max-width:240px}
}
</style>
<style id="mobile-fullscreen-fix">
html,body{width:100%;height:100%;min-height:100%;margin:0;padding:0;overflow:hidden;overscroll-behavior:none}
body{min-height:100dvh;width:100vw}
#app,canvas{width:100%;height:100%;min-height:100dvh}
*{box-sizing:border-box}
@media (max-width:700px){
  body{font-size:14px}
  .topbar{top:max(8px,env(safe-area-inset-top));left:8px;right:8px;width:auto;max-width:none;padding:9px 10px;border-radius:16px}
  .stats{gap:5px;overflow-x:auto;scrollbar-width:none}
  .stats::-webkit-scrollbar{display:none}
  .stat{padding:6px 8px;white-space:nowrap;font-size:12px}
  .toolbar{left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));width:auto;max-width:none;padding:7px;overflow-x:auto;display:flex;gap:7px;scrollbar-width:none}
  .toolbar::-webkit-scrollbar{display:none}
  .tool{min-width:72px;flex:0 0 72px;padding:8px 5px}
  .panel{left:8px;right:8px;width:auto;max-width:none;bottom:105px}
  button{min-height:44px}
}
</style></head>
<body>
<div id="app">
<canvas id="game"></canvas>
<header class="top">
  <div class="logo">🏘️ בונה השכונה<span>העיר שלך. הכל בידיים שלך.</span></div>
  <div class="stats">
    <div class="stat">💰 <b id="money">12,000</b><br>₪</div>
    <div class="stat">👨‍👩‍👧 <b id="pop">18</b><br>תושבים</div>
    <div class="stat">⭐ <b id="score">72</b><br>דירוג</div>
    
  </div>
  <button class="topBtn" id="pause" aria-label="השהה">Ⅱ</button>
  <button class="topBtn" id="settings" aria-label="הגדרות">⚙️</button>
</header>
<div class="tip">גרור את המפה כדי לטייל • בחר מבנה ולחץ על שטח פנוי</div>
<div id="menu" class="menu">
  <h3>ניהול השכונה</h3><p>שמור את ההתקדמות שלך או התחל שכונה חדשה.</p>
  <div class="menuRow"><button id="save">💾 שמור</button><button id="load">↩️ טען</button></div>
  <div class="menuRow" style="margin-top:8px"><button id="reset">♻️ התחל מחדש</button><button class="primary" id="close">סגור</button></div>
</div>
<div id="info" class="info"><b id="infoTitle">בחר מבנה</b><small id="infoText">לחץ על מבנה שכבר בנית כדי לראות פרטים.</small></div>

<nav class="buildbar" id="buildbar"></nav>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W=0,H=0,DPR=1;
const S={money:12000,pop:18,score:72 ,paused:false,tool:'select',zoom:.95,ox:0,oy:0,dragging:false,moved:false,lastX:0,lastY:0,preview:null,selected:null,objects:[],visitors:[],incomeTimer:0};
const types={
 road:{cost:250,w:2,h:1,color:'#9aa5b1',icon:'🛣️',name:'כביש',desc:'מחבר את השכונה ומעלה נוחות.'},
 house:{cost:1200,w:1,h:1,color:'#f4c95d',icon:'🏠',name:'בית פרטי',desc:'+4 תושבים'},
 apartment:{cost:3500,w:1.4,h:1.4,color:'#70b7d6',icon:'🏢',name:'בניין מגורים',desc:'+14 תושבים'},
 shop:{cost:2200,w:1,h:1,color:'#e88963',icon:'🏪',name:'חנות',desc:'מוסיפה הכנסה לתקציב.'},
 park:{cost:900,w:1.3,h:1.3,color:'#62a878',icon:'🌳',name:'פארק',desc:'מעלה את איכות החיים.'},
 school:{cost:4000,w:1.5,h:1.3,color:'#9b8ee8',icon:'🏫',name:'בית ספר',desc:'מעלה את דירוג השכונה.'},
 road2:{cost:450,w:1,h:1,color:'#9aa5b1',icon:'↕️',name:'צומת',desc:'קטע כביש קצר.'}
};
const tools=['select','road','house','apartment','shop','park','school','bulldoze'];
const labels={select:['👆','בחירה',''],road:['🛣️','כביש','250₪'],house:['🏠','בית','1,200₪'],apartment:['🏢','בניין','3,500₪'],shop:['🏪','חנות','2,200₪'],park:['🌳','פארק','900₪'],school:['🏫','בית ספר','4,000₪'],bulldoze:['⌫','הריסה','']};
const bar=document.getElementById('buildbar');
tools.forEach(t=>{const b=document.createElement('button');b.className='tool'+(t==='select'?' active':'');b.dataset.tool=t;const l=labels[t];b.innerHTML='<div class="ico">'+l[0]+'</div><small>'+l[1]+(l[2]?'<br>'+l[2]:'')+'</small>';b.onclick=()=>selectTool(t);bar.appendChild(b)});
function selectTool(t){S.tool=t;S.preview=null;document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));hideInfo();draw()}
function resize(){DPR=devicePixelRatio||1;W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);if(!S.ox){S.ox=W/2;S.oy=H/2+25}draw()}
addEventListener('resize',resize);
function cell(){return 62*S.zoom}
function toScreen(x,y){const s=cell();return{x:S.ox+(x-y)*s/2,y:S.oy+(x+y)*s/4}}
function toGrid(x,y){const s=cell(),a=(x-S.ox)/(s/2),b=(y-S.oy)/(s/4);return{x:Math.floor((a+b)/2),y:Math.floor((b-a)/2)}}
function diamond(x,y,w,h,fill,stroke='#0001'){ctx.beginPath();ctx.moveTo(x,y-h/2);ctx.lineTo(x+w/2,y);ctx.lineTo(x,y+h/2);ctx.lineTo(x-w/2,y);ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.stroke()}
function draw(){
 ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#cfe4c6');bg.addColorStop(1,'#b9d6b1');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 const s=cell();
 for(let x=-15;x<=15;x++)for(let y=-15;y<=15;y++){const p=toScreen(x,y);diamond(p.x,p.y,s,s/2,(x+y)%2?'#d8e9cf':'#d2e5c9','#ffffff65')}
 [...S.objects].sort((a,b)=>(a.x+a.y)-(b.x+b.y)).forEach(drawObject);if(S.preview)drawPreview();drawVisitors();
}

function drawObject(o){
 const t=types[o.type],p=toScreen(o.x,o.y),w=cell()*t.w,h=cell()*t.h;
 if(o.type==='road'){diamond(p.x,p.y,w,h,'#929ca7','#66717d');ctx.strokeStyle='#e9edf1';ctx.setLineDash([7,6]);ctx.beginPath();ctx.moveTo(p.x-w*.32,p.y);ctx.lineTo(p.x+w*.32,p.y);ctx.stroke();ctx.setLineDash([])}
 else{
  ctx.save();ctx.shadowColor='#23304425';ctx.shadowBlur=8;ctx.shadowOffsetY=4;diamond(p.x,p.y,w,h,'#b6c8ad','#ffffff70');ctx.restore();
  ctx.save();ctx.shadowColor='#23304430';ctx.shadowBlur=9;ctx.shadowOffsetY=4;ctx.fillStyle=t.color;ctx.beginPath();ctx.roundRect(p.x-w*.28,p.y-h*.62,w*.56,h*.64,8);ctx.fill();ctx.restore();
  ctx.font=Math.max(20,27*S.zoom)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t.icon,p.x,p.y-h*.22);
  ctx.fillStyle='#ffffffaa';ctx.fillRect(p.x-w*.18,p.y-h*.43,8,7);ctx.fillRect(p.x+w*.06,p.y-h*.43,8,7);
 }
 if(S.selected===o){ctx.lineWidth=3;diamond(p.x,p.y,w+10,h+10,'transparent','#315efb');ctx.lineWidth=1}
}
function drawPreview(){const t=types[S.tool];if(!t)return;const p=toScreen(S.preview.x,S.preview.y);diamond(p.x,p.y,cell()*t.w,cell()*t.h,'#315efb38','#315efb99');ctx.font='24px serif';ctx.textAlign='center';ctx.fillText(t.icon,p.x,p.y)}
function drawVisitors(){ctx.font='17px serif';S.visitors.forEach(v=>{const p=toScreen(v.x,v.y);ctx.fillText(v.icon,p.x,p.y-6)})}
function occupied(x,y,w,h){return S.objects.some(o=>Math.abs(o.x-x)<(w+types[o.type].w)/2-.08&&Math.abs(o.y-y)<(h+types[o.type].h)/2-.08)}
function place(x,y){
 if(S.tool==='bulldoze'){const i=S.objects.findIndex(o=>Math.abs(o.x-x)<.75&&Math.abs(o.y-y)<.75);if(i<0){return}const o=S.objects[i],refund=Math.floor(types[o.type].cost*.35);S.objects.splice(i,1);S.money+=refund;if(o.type==='house')S.pop=Math.max(0,S.pop-4);if(o.type==='apartment')S.pop=Math.max(0,S.pop-14);S.score=Math.max(0,S.score-1);update();return}
 if(S.tool==='select'){selectAt(x,y);return}
 const t=types[S.tool];if(!t)return;if(S.money<t.cost){return}if(occupied(x,y,t.w,t.h)){return}
 const o={x,y,type:S.tool,id:Date.now()};S.money-=t.cost;S.objects.push(o);
 if(S.tool==='house')S.pop+=4;if(S.tool==='apartment')S.pop+=14;if(S.tool==='school')S.score+=5;if(S.tool==='park')S.score+=3;if(S.tool==='shop')S.score+=2;
 S.score=Math.min(100,S.score+1);S.selected=o;update();
}
function selectAt(x,y){let found=S.objects.findLast(o=>Math.abs(o.x-x)<.8&&Math.abs(o.y-y)<.8);if(found){S.selected=found;const t=types[found.type];document.getElementById('infoTitle').textContent=t.icon+' '+t.name;document.getElementById('infoText').textContent=t.desc+' • עלות: '+t.cost.toLocaleString('he-IL')+'₪';document.getElementById('info').classList.add('show')}else hideInfo();draw()}
function hideInfo(){S.selected=null;document.getElementById('info').classList.remove('show')}
function update(){document.getElementById('money').textContent=Math.floor(S.money).toLocaleString('he-IL');document.getElementById('pop').textContent=S.pop;document.getElementById('score').textContent=Math.floor(S.score);}

canvas.addEventListener('pointerdown',e=>{S.dragging=true;S.moved=false;S.lastX=e.clientX;S.lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{const dx=e.clientX-S.lastX,dy=e.clientY-S.lastY;if(S.dragging&&(S.tool==='select'||e.buttons)){if(Math.abs(dx)+Math.abs(dy)>4)S.moved=true;if(S.tool==='select'){S.ox+=dx;S.oy+=dy}}S.lastX=e.clientX;S.lastY=e.clientY;S.preview=toGrid(e.clientX,e.clientY);draw()});
canvas.addEventListener('pointerup',e=>{S.dragging=false;if(!S.moved){const g=toGrid(e.clientX,e.clientY);place(g.x,g.y)}});
canvas.addEventListener('wheel',e=>{e.preventDefault();const before=toGrid(e.clientX,e.clientY);S.zoom=Math.max(.55,Math.min(1.75,S.zoom*(e.deltaY<0?1.08:.92)));const after=toScreen(before.x,before.y);S.ox+=e.clientX-after.x;S.oy+=e.clientY-after.y;draw()},{passive:false});
let pinch=0;canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();const a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pinch){S.zoom=Math.max(.55,Math.min(1.75,S.zoom*d/pinch);draw()}pinch=d}},{passive:false});canvas.addEventListener('touchend',()=>pinch=0);
document.getElementById('pause').onclick=()=>{S.paused=!S.paused;document.getElementById('pause').textContent=S.paused?'▶':'Ⅱ'};
document.getElementById('settings').onclick=()=>document.getElementById('menu').classList.toggle('show');
document.getElementById('close').onclick=()=>document.getElementById('menu').classList.remove('show');
document.getElementById('save').onclick=()=>{localStorage.nbNeighborhood=JSON.stringify({money:S.money,pop:S.pop,score:S.score,objects:S.objects})};
document.getElementById('load').onclick=()=>{try{Object.assign(S,JSON.parse(localStorage.nbNeighborhood));update();draw()}};
document.getElementById('reset').onclick=()=>{if(confirm('למחוק את השכונה ולהתחיל מחדש?')){S.money=12000;S.pop=18;S.score=72;S.objects=[];S.visitors=[];update();draw()}};
function tick(){if(!S.paused){S.incomeTimer++;if(S.incomeTimer>180){S.incomeTimer=0;const shops=S.objects.filter(o=>o.type==='shop').length;const parks=S.objects.filter(o=>o.type==='park').length;const income=25+shops*35+parks*8;S.money+=income;if(shops)if(Math.random()<.5)S.visitors.push({x:Math.floor(Math.random()*11)-5,y:Math.floor(Math.random()*11)-5,icon:Math.random()<.5?'🚶':'🚶‍♀️'});if(S.visitors.length>12)S.visitors.shift();update()}draw()}requestAnimationFrame(tick)}
update();resize();tick();
</script>
</body>
</html>
