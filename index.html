<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>אדם רץ</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#bfe7ff}
body{display:flex;align-items:center;justify-content:center}
#game{position:relative;width:100%;height:100%;max-width:900px;overflow:hidden;background:linear-gradient(#bfe7ff 0 55%,#87c96b 55% 100%)}
#sun{position:absolute;width:90px;height:90px;border-radius:50%;background:#ffe58a;top:7%;right:10%;box-shadow:0 0 35px #fff0a8}
.cloud{position:absolute;background:white;border-radius:50px;opacity:.8;width:150px;height:35px;top:15%;left:8%}
.cloud:before,.cloud:after{content:"";position:absolute;background:white;border-radius:50%;width:55px;height:55px;top:-25px}
.cloud:before{left:25px}.cloud:after{left:75px}
#ground{position:absolute;left:-20%;width:140%;height:55%;bottom:-18%;background:#6fba59;transform:rotate(-2deg);border-top:5px solid #4e963f}
.road{position:absolute;left:-10%;width:120%;height:120px;bottom:18%;background:#777;transform:rotate(-4deg);box-shadow:0 5px 0 #555}
.lane{position:absolute;left:0;right:0;top:55px;border-top:6px dashed #eee}
#runner{position:absolute;width:70px;height:125px;left:50%;bottom:28%;transform:translateX(-50%);transition:left .08s}
.head{position:absolute;width:42px;height:42px;background:#f1b27a;border-radius:50%;left:14px;top:0;box-shadow:inset -4px -3px 0 #d89561}
.body{position:absolute;width:40px;height:55px;background:#2764d8;border-radius:18px 18px 10px 10px;left:15px;top:38px}
.arm,.leg{position:absolute;background:#f1b27a;border-radius:15px;transform-origin:top center}
.arm{width:11px;height:48px;top:43px}.arm.a{left:10px;transform:rotate(38deg)}.arm.b{right:8px;transform:rotate(-38deg)}
.leg{width:13px;height:55px;top:86px;background:#333}.leg.a{left:17px;transform:rotate(28deg)}.leg.b{right:17px;transform:rotate(-28deg)}
.shoe{position:absolute;width:29px;height:12px;background:#222;border-radius:12px;bottom:-4px}.leg.a .shoe{left:-8px}.leg.b .shoe{right:-8px}
#hud{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;direction:rtl}
.panel{background:#ffffffdd;padding:10px 15px;border-radius:16px;font-weight:700;box-shadow:0 4px 15px #0002}
#hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:#ffffffdd;padding:10px 16px;border-radius:20px;white-space:nowrap}
#score{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="game">
<div id="sun"></div><div class="cloud"></div><div id="ground"></div>
<div class="road"><div class="lane"></div></div>
<div id="runner">
<div class="head"></div><div class="body"></div>
<div class="arm a"></div><div class="arm b"></div>
<div class="leg a"><div class="shoe"></div></div><div class="leg b"><div class="shoe"></div></div>
</div>
<div id="hud"><div class="panel">אדם רץ</div><div class="panel">מרחק: <span id="score">0</span> מ׳</div></div>
<div id="hint">גרור ימינה ושמאלה כדי להזיז את האדם</div>
</div>
<script>
const runner=document.getElementById('runner'),score=document.getElementById('score'),game=document.getElementById('game');
let x=50,meters=0,last=performance.now(),drag=false;
function setX(clientX){const r=game.getBoundingClientRect();x=Math.max(12,Math.min(88,(clientX-r.left)/r.width*100));runner.style.left=x+'%'}
game.addEventListener('pointerdown',e=>{drag=true;game.setPointerCapture(e.pointerId);setX(e.clientX)});
game.addEventListener('pointermove',e=>{if(drag)setX(e.clientX)});
game.addEventListener('pointerup',()=>drag=false);
function loop(t){const dt=(t-last)/1000;last=t;meters+=dt*3;score.textContent=meters.toFixed(1);requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
</body></html>
