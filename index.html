<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>רץ 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87ceeb;font-family:Arial,sans-serif;touch-action:none}
#scene{position:fixed;inset:0}canvas{display:block}
.hud{position:fixed;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;z-index:5;color:white;font-weight:800;font-size:17px}
.badge{background:rgba(15,23,42,.78);padding:10px 15px;border-radius:14px;backdrop-filter:blur(10px);box-shadow:0 6px 20px #0004;border:1px solid #ffffff33}
#hint{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:5;color:#fff;background:rgba(15,23,42,.82);padding:11px 17px;border-radius:18px;font-size:14px;white-space:nowrap;box-shadow:0 6px 20px #0004}
#title{position:fixed;top:78px;left:50%;transform:translateX(-50%);z-index:5;color:#fff;font-size:28px;font-weight:900;text-shadow:0 3px 12px #0008;white-space:nowrap}
#start{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:linear-gradient(#0004,#0008);transition:opacity .35s}
.panel{width:min(88%,360px);padding:26px;border-radius:24px;background:rgba(255,255,255,.95);box-shadow:0 20px 60px #0006;text-align:center;color:#172033}
.panel h1{margin:0 0 8px;font-size:30px}.panel p{margin:0 0 20px;color:#64748b}
#play{border:0;border-radius:14px;padding:13px 28px;background:#2563eb;color:#fff;font-size:18px;font-weight:800}
#joystick{position:fixed;bottom:22px;left:22px;width:125px;height:125px;border-radius:50%;background:#0005;border:2px solid #fff8;z-index:10}
#stick{position:absolute;width:58px;height:58px;border-radius:50%;background:#fff;left:31px;top:31px;box-shadow:0 3px 12px #0006}
</style>
</head>
<body>
<div id="scene"></div><div id="title">ריצה בפארק</div><div id="start"><div class="panel"><h1>ריצה בפארק</h1><p>הדמות רצה קדימה. השתמש בג׳ויסטיק כדי לפנות.</p><button id="play">התחל לרוץ</button></div></div>
<div class="hud"><div class="badge">רץ 3D</div><div class="badge">מטבעות: <span id="money">0</span></div><div class="badge">מרחק: <span id="distance">0</span> מ׳</div></div><div id="vehicleAction" style="display:none;position:fixed;bottom:170px;left:50%;transform:translateX(-50%);z-index:15"><button id="sellVehicle" style="border:0;border-radius:16px;padding:13px 20px;background:#16a34a;color:#fff;font-size:16px;font-weight:800;box-shadow:0 8px 25px #0005">מכור רכב</button></div>
<div id="hint">הדמות רצה אוטומטית • גרור את הג׳ויסטיק כדי לפנות</div>
<div id="joystick"><div id="stick"></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,35,140);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,300);
camera.position.set(0,5.2,10); camera.lookAt(0,1.2,0);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true;
document.getElementById('scene').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xbfeeff,0x557744,2));
const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(-20,30,15);sun.castShadow=true;scene.add(sun);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,300),new THREE.MeshStandardMaterial({color:0x55a947}));
ground.rotation.x=-Math.PI/2;ground.position.z=-80;ground.receiveShadow=true;scene.add(ground);
const road=new THREE.Mesh(new THREE.PlaneGeometry(7,300),new THREE.MeshStandardMaterial({color:0x555b62}));
road.rotation.x=-Math.PI/2;road.position.y=.012;road.position.z=-80;road.receiveShadow=true;scene.add(road);
for(let z=5;z>-250;z-=8){const line=new THREE.Mesh(new THREE.BoxGeometry(.22,.025,4),new THREE.MeshStandardMaterial({color:0xffffff}));line.position.set(0,.04,z);scene.add(line)}
function tree(x,z){
 const g=new THREE.Group();
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22,.28,1.7,8),new THREE.MeshStandardMaterial({color:0x76502d}));
 trunk.position.y=.85;trunk.castShadow=true;g.add(trunk);
 const crown=new THREE.Mesh(new THREE.SphereGeometry(1.15,12,10),new THREE.MeshStandardMaterial({color:0x237a35}));
 crown.position.y=2.15;crown.castShadow=true;g.add(crown);g.position.set(x,0,z);scene.add(g);
}
for(let z=0;z>-220;z-=12){tree(-6-Math.random()*4,z);tree(6+Math.random()*4,z-5)}

const runner=new THREE.Group(); runner.position.set(0,0,3);\nconst obstacles=[],coins=[],vehicles=[];\nfunction obstacle(x,z,type){const g=new THREE.Group();const m=mat(type==="barrier"?0xf97316:0x7c3aed);const b=new THREE.Mesh(new THREE.BoxGeometry(1.25,.9,.8),m);b.position.y=.45;b.castShadow=true;g.add(b);if(type==="barrier"){const stripe=new THREE.Mesh(new THREE.BoxGeometry(1.35,.12,.84),mat(0xffffff));stripe.position.y=.65;g.add(stripe)}g.position.set(x,0,z);scene.add(g);obstacles.push(g)}\nfunction coin(x,z){const c=new THREE.Mesh(new THREE.CylinderGeometry(.28,.28,.08,20),mat(0xffd21f));c.rotation.x=Math.PI/2;c.position.set(x,.65,z);c.castShadow=true;scene.add(c);coins.push(c)}\nfor(let z=-18;z>-230;z-=18){const lane=(Math.floor(Math.abs(z)/18)%3)-1; obstacle(lane*2.05,z,"barrier"); coin(-lane*2.05,z-6); if(z%36===0) coin(0,z-9)}\nfunction vehicle(x,z,type="car"){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(1.25,.42,2.15),mat(type==="bike"?0x16a34a:0xdc2626));body.position.y=.55;body.castShadow=true;g.add(body);const cabin=new THREE.Mesh(new THREE.BoxGeometry(.9,.42,.95),mat(0x334155));cabin.position.set(0,.88,.05);cabin.castShadow=true;g.add(cabin);if(type==="bike"){const w=new THREE.Mesh(new THREE.TorusGeometry(.28,.07,8,16),mat(0x111827));w.rotation.y=Math.PI/2;w.position.set(0,.3,.72);g.add(w);const w2=w.clone();w2.position.z=-.72;g.add(w2)}else{for(const xx of [-.65,.65])for(const zz of [-.68,.68]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.16,.16,.12,12),mat(0x111827));w.rotation.z=Math.PI/2;w.position.set(xx,.32,zz);g.add(w)}}g.position.set(x,.05,z);scene.add(g);vehicles.push({g,type,sold:false,price:type==="bike"?80:180});}\nvehicle(-2.1,-12,"car");vehicle(2.1,-42,"car");vehicle(0,-78,"bike");vehicle(-2.1,-120,"car");
function mat(c){return new THREE.MeshStandardMaterial({color:c})}
const skin=mat(0xf0b38c), shirt=mat(0x2468d8), pants=mat(0x252b38), shoes=mat(0xeeeeee);
const torso=new THREE.Mesh(new THREE.BoxGeometry(.75,1.15,.45),shirt);torso.position.y=1.75;torso.castShadow=true;runner.add(torso);
const head=new THREE.Mesh(new THREE.SphereGeometry(.38,16,12),skin);head.position.y=2.65;head.castShadow=true;runner.add(head);
const armL=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.65,6,10),shirt),armR=armL.clone();
armL.position.set(-.55,1.82,0);armR.position.set(.55,1.82,0);runner.add(armL,armR);
const legL=new THREE.Mesh(new THREE.CapsuleGeometry(.14,.72,6,10),pants),legR=legL.clone();
legL.position.set(-.22,.85,0);legR.position.set(.22,.85,0);runner.add(legL,legR);
const footL=new THREE.Mesh(new THREE.BoxGeometry(.3,.16,.6),shoes),footR=footL.clone();
footL.position.set(-.22,.35,-.18);footR.position.set(.22,.35,-.18);runner.add(footL,footR);
scene.add(runner);

let vx=0,runTime=0,distance=0,last=performance.now(),joyX=0,money=0,gameStarted=false;
const joy=document.getElementById('joystick'),stick=document.getElementById('stick');
let active=false;
function moveJoy(x,y){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=x-cx,dy=y-cy;const max=42;const d=Math.hypot(dx,dy);if(d>max){dx*=max/d;dy*=max/d}stick.style.transform=`translate(${dx}px,${dy}px)`;joyX=dx/max}
function endJoy(){active=false;stick.style.transform='translate(0,0)';joyX=0}
joy.addEventListener('pointerdown',e=>{active=true;joy.setPointerCapture(e.pointerId);moveJoy(e.clientX,e.clientY)});
joy.addEventListener('pointermove',e=>{if(active)moveJoy(e.clientX,e.clientY)});
joy.addEventListener('pointerup',endJoy);joy.addEventListener('pointercancel',endJoy);

function animate(now){
 const dt=Math.min((now-last)/1000,.05);last=now;
 runTime+=dt*10;
 // continuous forward running
 runner.position.z-=dt*5.2;
 runner.position.x+=joyX*dt*5;
 runner.position.x=Math.max(-2.7,Math.min(2.7,runner.position.x));
 runner.rotation.y=-joyX*.18;
 const swing=Math.sin(runTime)*.85;
 armL.rotation.x=swing;armR.rotation.x=-swing;legL.rotation.x=-swing;legR.rotation.x=swing;
 torso.position.y=1.75+Math.abs(Math.sin(runTime*2))*.035;
 distance+=dt*5.2;
 document.getElementById('distance').textContent=Math.floor(distance);
 // keep camera behind player, smoothly
 camera.position.x+=(runner.position.x*.45-camera.position.x)*dt*4;
 camera.position.z+=(runner.position.z+7.5-camera.position.z)*dt*4;
 camera.position.y+=(4.7-camera.position.y)*dt*4;
 camera.lookAt(runner.position.x*.35,1.35,runner.position.z-8);
 // recycle scenery by moving camera-relative objects forward
 for(const o of scene.children){if(o.userData && o.userData.scenery){}
 }
 renderer.render(scene,camera);requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
<script>document.getElementById("play").addEventListener("click",()=>{const s=document.getElementById("start");s.style.opacity="0";setTimeout(()=>s.remove(),350)});</script></body></html>
