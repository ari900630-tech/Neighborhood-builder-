<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#102a43"><title>בונה השכונה</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#0d1b2a;color:#17202a;touch-action:none}
#app{width:100%;height:100%;position:relative;background:#dce7d1}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.top{position:absolute;top:0;left:0;right:0;height:72px;background:linear-gradient(135deg,#102a43f5,#1b4965f5);color:white;display:flex;align-items:center;gap:10px;padding:10px 14px;box-shadow:0 4px 18px #0004;z-index:5}
.brand{font-weight:900;font-size:19px;min-width:120px}.stats{display:flex;gap:8px;flex:1;justify-content:center;flex-wrap:wrap}.pill{background:#ffffff18;border:1px solid #ffffff25;border-radius:14px;padding:8px 11px;font-size:13px;white-space:nowrap}.top button,.round{border:0;background:#ffffff16;color:#fff;border-radius:12px;padding:10px 12px;font-weight:800}
.toolbar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:6;background:#ffffffee;border:1px solid #ffffff;border-radius:22px;padding:8px;display:flex;gap:6px;box-shadow:0 10px 35px #0003;max-width:calc(100% - 18px);overflow:auto}
.tool{min-width:72px;border:0;background:#f2f5f7;border-radius:15px;padding:8px 9px;font-weight:800;color:#243b53}.tool b{display:block;font-size:21px}.tool small{display:block;font-size:10px;margin-top:2px}.tool.active{background:#102a43;color:white;box-shadow:0 4px 12px #102a4366}
.panel{position:absolute;z-index:7;right:12px;top:84px;width:290px;max-width:calc(100% - 24px);background:#fffffff5;border-radius:20px;box-shadow:0 12px 35px #0003;padding:16px;display:none}.panel.show{display:block}.panel h3{margin:0 0 10px}.panel p{margin:6px 0;color:#52606d;font-size:13px}.row{display:flex;gap:8px;margin-top:10px}.action{flex:1;border:0;border-radius:12px;padding:11px;font-weight:800;background:#e8eef2;color:#243b53}.action.primary{background:#102a43;color:white}
.toast{position:absolute;z-index:20;top:84px;left:50%;transform:translateX(-50%) translateY(-10px);background:#102a43;color:#fff;padding:11px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 8px 25px #0004;font-weight:700}.toast.on{opacity:1;transform:translateX(-50%)}
.help{position:absolute;left:12px;top:84px;background:#ffffffdc;border-radius:16px;padding:9px 12px;font-size:12px;z-index:4;box-shadow:0 6px 20px #0002;color:#486581}
@media(max-width:700px){.top{height:64px;padding:7px 8px}.brand{font-size:15px;min-width:92px}.pill{padding:6px 8px;font-size:11px}.top button{padding:8px}.help{top:72px}.panel{top:72px}.toolbar{bottom:7px;border-radius:18px}.tool{min-width:62px}}
</style></head>
<body>
<div id="app"><canvas id="game"></canvas>
<header class="top"><div class="brand">🏘️ בונה השכונה</div><div class="stats"><div class="pill">💰 <span id="money">12,000</span> ₪</div><div class="pill">👨‍👩‍👧 <span id="pop">18</span></div><div class="pill">⭐ <span id="score">72</span></div><div class="pill">📅 יום <span id="day">1</span></div></div><button id="pause">Ⅱ</button><button id="settings">⚙️</button></header>
<div class="help">גרור כדי להזיז • צבוט כדי להתקרב/להתרחק • בחר בניין ולחץ על שטח פנוי</div>
<div id="panel" class="panel"><h3 id="panelTitle">הגדרות</h3><p id="panelText">נהל את השכונה שלך.</p><div class="row"><button class="action" id="save">💾 שמור</button><button class="action" id="load">↩️ טען</button></div><div class="row"><button class="action" id="reset">♻️ התחל מחדש</button><button class="action primary" id="close">סגור</button></div></div>
<div id="toast" class="toast"></div>
<nav class="toolbar">
<button class="tool active" data-tool="select"><b>👆</b><small>בחירה</small></button>
<button class="tool" data-tool="road"><b>🛣️</b><small>כביש 250₪</small></button>
<button class="tool" data-tool="house"><b>🏠</b><small>בית 1,200₪</small></button>
<button class="tool" data-tool="apartment"><b>🏢</b><small>בניין 3,500₪</small></button>
<button class="tool" data-tool="shop"><b>🏪</b><small>חנות 2,200₪</small></button>
<button class="tool" data-tool="park"><b>🌳</b><small>פארק 900₪</small></button>
<button class="tool" data-tool="school"><b>🏫</b><small>בית ספר 4,000₪</small></button>
<button class="tool" data-tool="bulldoze"><b>🗑️</b><small>הריסה</small></button>
</nav></div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');let W,H,DPR;
const S={money:12000,pop:18,score:72,day:1,paused:false,tool:'select',zoom:1,ox:0,oy:0,drag:false,lastX:0,lastY:0,objects:[],selected:null,visitors:[]};
const types={road:{cost:250,w:2,h:1,color:'#7b8794',icon:'🛣️'},house:{cost:1200,w:1,h:1,color:'#f2c14e',icon:'🏠'},apartment:{cost:3500,w:1.4,h:1.4,color:'#8ecae6',icon:'🏢'},shop:{cost:2200,w:1,h:1,color:'#ef8354',icon:'🏪'},park:{cost:900,w:1.3,h:1.3,color:'#70a288',icon:'🌳'},school:{cost:4000,w:1.5,h:1.3,color:'#9b8afb',icon:'🏫'}};
function resize(){DPR=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);if(!S.ox){S.ox=W/2;S.oy=H/2+20}draw()}addEventListener('resize',resize);
function gridToScreen(gx,gy){const size=64*S.zoom;return{x:S.ox+(gx-gy)*size/2,y:S.oy+(gx+gy)*size/4}}
function screenToGrid(x,y){const size=64*S.zoom;const a=(x-S.ox)/(size/2),b=(y-S.oy)/(size/4);return{x:Math.floor((a+b)/2),y:Math.floor((b-a)/2)}}
function diamond(x,y,w,h,fill,stroke){ctx.beginPath();ctx.moveTo(x,y-h/2);ctx.lineTo(x+w/2,y);ctx.lineTo(x,y+h/2);ctx.lineTo(x-w/2,y);ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke||'#0002';ctx.stroke()}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#b9d6a8';ctx.fillRect(0,0,W,H);const size=64*S.zoom;
for(let gx=-12;gx<13;gx++)for(let gy=-12;gy<13;gy++){let p=gridToScreen(gx,gy);diamond(p.x,p.y,size,size/2,(gx+gy)%2?'#c7dfb6':'#c2d9b0','#ffffff55')}
S.objects.forEach(o=>drawObj(o));drawPreview();drawVisitors()}
function drawObj(o){let p=gridToScreen(o.x,o.y),t=types[o.type],w=sizeFor(t.w),h=sizeFor(t.h);if(o.type==='road'){diamond(p.x,p.y,w,h,t.color,'#52606d')}else{diamond(p.x,p.y,w,h,'#0002','#0002');ctx.fillStyle=t.color;ctx.fillRect(p.x-w*.28,p.y-h*.7,w*.56,h*.7);ctx.font=Math.max(18,25*S.zoom)+'px serif';ctx.textAlign='center';ctx.fillText(t.icon,p.x,p.y-h*.2);ctx.fillStyle='#ffffffcc';ctx.fillRect(p.x-w*.28,p.y-h*.58,w*.56,5);ctx.fillStyle='#fff';ctx.fillRect(p.x-w*.2,p.y-h*.48,7,7);ctx.fillRect(p.x+w*.08,p.y-h*.48,7,7)}if(S.selected===o){ctx.strokeStyle='#fff';ctx.lineWidth=4;diamond(p.x,p.y,w+8,h+8,'transparent','#fff');ctx.lineWidth=1}}
function sizeFor(v){return 64*S.zoom*v}
function drawPreview(){if(S.tool==='select'||S.tool==='bulldoze'||!S.preview)return;let p=gridToScreen(S.preview.x,S.preview.y),t=types[S.tool];diamond(p.x,p.y,sizeFor(t.w),sizeFor(t.h),'#ffffff55','#fff');ctx.font='25px serif';ctx.textAlign='center';ctx.fillText(t.icon,p.x,p.y+8)}
function drawVisitors(){ctx.font='16px serif';S.visitors.forEach(v=>{let p=gridToScreen(v.x,v.y);ctx.fillText(v.icon,p.x,p.y-5)})}
function occupied(x,y,w=1,h=1){return S.objects.some(o=>Math.abs(o.x-x)<(w+types[o.type].w)/2&&Math.abs(o.y-y)<(h+types[o.type].h)/2)}
function place(x,y){let t=types[S.tool];if(!t)return;if(S.tool==='bulldoze'){let i=S.objects.findIndex(o=>Math.abs(o.x-x)<.7&&Math.abs(o.y-y)<.7);if(i>=0){S.objects.splice(i,1);toast('המבנה נהרס');S.pop=Math.max(0,S.pop-1);update()}return}if(S.money<t.cost){toast('אין מספיק כסף');return}if(occupied(x,y,t.w,t.h)){toast('השטח תפוס');return}S.money-=t.cost;S.objects.push({x,y,type:S.tool,id:Date.now()});if(S.tool==='house')S.pop+=4;if(S.tool==='apartment')S.pop+=14;if(S.tool==='school')S.score+=4;if(S.tool==='park')S.score+=3;S.score=Math.min(100,S.score+1);toast(t.icon+' נבנה בהצלחה');update()}
function update(){money.textContent=S.money.toLocaleString('he-IL');pop.textContent=S.pop;score.textContent=S.score;day.textContent=S.day}
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.add('on');clearTimeout(window.tt);window.tt=setTimeout(()=>el.classList.remove('on'),1500)}
document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tool').forEach(x=>x.classList.remove('active'));b.classList.add('active');S.tool=b.dataset.tool;S.preview=null});
c.addEventListener('pointerdown',e=>{S.drag=true;S.lastX=e.clientX;S.lastY=e.clientY;c.setPointerCapture(e.pointerId)});
c.addEventListener('pointermove',e=>{if(S.drag&&S.tool==='select'){S.ox+=e.clientX-S.lastX;S.oy+=e.clientY-S.lastY}S.lastX=e.clientX;S.lastY=e.clientY;let g=screenToGrid(e.clientX,e.clientY);S.preview=g;draw()});
c.addEventListener('pointerup',e=>{S.drag=false;if(S.tool!=='select'){let g=screenToGrid(e.clientX,e.clientY);place(g.x,g.y)}});
c.addEventListener('wheel',e=>{e.preventDefault();S.zoom=Math.max(.55,Math.min(1.8,S.zoom*(e.deltaY<0?1.1:.9)));draw()},{passive:false});
let touchDist=0;c.addEventListener('touchmove',e=>{if(e.touches.length===2){let a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(touchDist){S.zoom=Math.max(.55,Math.min(1.8,S.zoom*d/touchDist));draw()}touchDist=d}},{passive:false});c.addEventListener('touchend',()=>touchDist=0);
pause.onclick=()=>{S.paused=!S.paused;pause.textContent=S.paused?'▶':'Ⅱ';toast(S.paused?'המשחק מושהה':'המשחק ממשיך')};
settings.onclick=()=>panel.classList.toggle('show');close.onclick=()=>panel.classList.remove('show');
save.onclick=()=>{localStorage.nbSave=JSON.stringify({money:S.money,pop:S.pop,score:S.score,day:S.day,objects:S.objects});toast('השכונה נשמרה')};
load.onclick=()=>{try{let x=JSON.parse(localStorage.nbSave);Object.assign(S,x);toast('השכונה נטענה');update();draw()}catch(e){toast('אין שמירה זמינה')}};
reset.onclick=()=>{if(confirm('להתחיל מחדש?')){S.money=12000;S.pop=18;S.score=72;S.day=1;S.objects=[];update();draw();toast('התחלת מחדש')}};
function tick(){if(!S.paused){S.day+=.01;if(S.day>30)S.day=1; if(Math.random()<.015&&S.objects.length){S.money+=30;toast('💰 הכנסה מהשכונה +30₪')}if(Math.random()<.02){S.visitors.push({x:Math.floor(Math.random()*9)-4,y:Math.floor(Math.random()*9)-4,icon:Math.random()<.5?'🚶':'🚶‍♀️'});if(S.visitors.length>14)S.visitors.shift()}update();draw()}requestAnimationFrame(tick)}update();resize();tick();
</script></body></html>
